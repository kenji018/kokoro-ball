<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こころ育て</title>
<meta name="description" content="心のためにした小さな行動で育つボール">
<meta name="theme-color" content="#EDEEEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="こころ育て">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: sister to こころボール. A small world on top (sky, ground, the growing ball and its moons); the day's record and the growth ledger below. */
:root{
  --bg:#EDEEEB; --surface:#F7F7F5; --ink:#23262A; --muted:#6C7076; --line:#D3D5D1;
  --accent:#4B4358; --accent-ink:#F7F7F5; --soft:#E4E2E8; --good:#5B7360;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --r:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131315; --surface:#1B1B1E; --ink:#E7E5E9; --muted:#9A979F; --line:#2E2D32;
  --accent:#BDB0CC; --accent-ink:#17161A; --soft:#26232B; --good:#9DB7A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131315; --surface:#1B1B1E; --ink:#E7E5E9; --muted:#9A979F; --line:#2E2D32;
  --accent:#BDB0CC; --accent-ink:#17161A; --soft:#26232B; --good:#9DB7A2; color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.8;letter-spacing:.02em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:500;font-size:1.45rem;margin:0;letter-spacing:.18em}
h2{font-family:var(--f-display);font-weight:500;font-size:1.05rem;letter-spacing:.16em;margin:0}
p{margin:0}
.date{color:var(--muted);font-size:.78rem;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.8rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

.world{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#1b2133;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.world canvas{display:block;width:100%;height:360px}
#sky,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}#gl{position:relative;z-index:1;touch-action:none;cursor:grab}#fx{z-index:2}
.wtop{position:absolute;left:14px;right:14px;top:12px;z-index:3;display:flex;justify-content:space-between;gap:10px;pointer-events:none;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.stage{font-family:var(--f-display);font-size:1.1rem;letter-spacing:.1em;line-height:1.3;white-space:nowrap;min-width:0}
.stage small{display:block;font-family:var(--f-body);font-size:.72rem;letter-spacing:.1em;opacity:.9}
.wx{text-align:right;font-size:.7rem;letter-spacing:.04em;line-height:1.55;white-space:nowrap;flex:none}
.wx b{font-family:var(--f-display);font-weight:500;font-size:1rem;letter-spacing:.08em}
.wbot:empty{display:none}
.wbot{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:rgba(20,24,32,.35);border-radius:99px;padding-block:2px;white-space:nowrap;z-index:3;text-align:center;color:#fff;font-family:var(--f-display);font-size:.88rem;letter-spacing:.14em;text-shadow:0 1px 6px rgba(0,0,0,.4);pointer-events:none;padding-inline:14px}

.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:.95rem;letter-spacing:.14em;padding:10px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.view{display:flex;flex-direction:column;gap:16px}
.section{display:flex;flex-direction:column;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.lbl{font-size:.86rem}
.hint{font-size:.76rem;color:var(--muted)}
textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:72px;resize:vertical;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.82rem;padding:3px 12px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.care{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.care button{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 2px;border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.care button b{font-family:var(--f-display);font-weight:500;font-size:.92rem}
.care button span{font-size:.62rem;color:var(--muted);line-height:1.3;text-align:center}
.care button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.primary{border:0;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-size:.95rem;letter-spacing:.2em;padding:12px 18px;border-radius:var(--r);cursor:pointer}
.primary:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.84rem;padding:8px 14px;border-radius:var(--r);cursor:pointer}
.link{border:0;background:transparent;color:var(--accent);font:inherit;font-size:.84rem;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{font-size:.84rem;color:var(--good);min-height:1.3em}

.prog{height:4px;background:var(--line);position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.4em;gap:10px;align-items:center;font-size:.84rem}
.row .bar{height:6px;background:var(--line);position:relative}
.row .bar i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--accent))}
.row .n{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.row .nm{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.manual{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem}
.rec{border-bottom:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:10px;align-items:start;font-size:.86rem}
.rec .d{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.rec .t{overflow-wrap:anywhere}
.rec .t small{display:block;color:var(--muted);font-size:.74rem}
.note{font-size:.76rem;color:var(--muted);line-height:1.7}
.banner{border-left:2px solid var(--accent);background:var(--soft);padding:10px 14px;font-size:.88rem}
@media (max-width:420px){.care{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>

<div class="app">
  <header><h1>こころ育て</h1><div class="date" id="today"></div></header>

  <section class="world" aria-label="こころの小さな世界">
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="gl" aria-label="育っていくこころのボール。なぞると回せます"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="wtop">
      <div class="stage" id="stageName">光の種<small id="formName"></small></div>
      <div class="wx" id="wx"><b>—</b><br></div>
    </div>
    <div class="wbot" id="wbot"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-v="grow" aria-selected="true">育てる</button>
    <button role="tab" data-v="log" aria-selected="false">記録</button>
    <button role="tab" data-v="set" aria-selected="false">価値と設定</button>
  </nav>

  <section class="view" id="v-grow"></section>
  <section class="view" id="v-log" hidden></section>
  <section class="view" id="v-set" hidden></section>
</div>

<script src="../three.min.js"></script>
<script>
(function(){
"use strict";
const T3=window.THREE;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const wd=["日","月","火","水","木","金","土"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const now=new Date();$("#today").textContent=(now.getMonth()+1)+"月"+now.getDate()+"日（"+wd[now.getDay()]+"）";

/* ---------- 決まりごと ---------- */
const CARE=[["rest","休む","眠る・休息",[30,70,74],"灯りのボール"],["move","動く","散歩・運動",[150,45,62],"はずむボール"],["connect","つながる","話す・会う",[14,62,72],"ぬくもりのボール"],
  ["challenge","挑戦する","初めて・苦手",[210,45,70],"結晶のボール"],["tidy","ととのえる","片づけ・振り返り",[262,25,78],"澄んだボール"]];
const CARE_MAP=Object.fromEntries(CARE.map(c=>[c[0],c]));
const STRENGTHS=[["好奇心",48],["向学心",34],["創造性",292],["勇気",8],["粘り強さ",22],["誠実さ",200],["思いやり",340],["感謝",58],["ユーモア",80],["チームワーク",160],["公平さ",232],["自分をととのえる力",272]];
const SCOL=Object.fromEntries(STRENGTHS.map(s=>[s[0],"hsl("+s[1]+",62%,62%)"]));
const VALUE_IDEAS=["家族","パートナー","友人","仕事","学び・成長","健康","誠実さ","やさしさ","挑戦","遊び・楽しさ","人の役に立つ","自然","創ること","落ち着き","自立","感謝"];
const MOON_HUES=[200,38,320,140,265];
const STAGES=[[0,"光の種"],[3,"小さな玉"],[10,"ボール"],[25,"かがやくボール"],[50,"星"]];
const STYLES=[["plain","そのまま",0],["watercolor","水彩",1],["gouache","絵本",2],["impression","印象派の筆",4],["anime","背景画",5],["pastel","パステル",6]];
let artStyle=load("kokoro-grow-style","plain");if(!STYLES.some(x=>x[0]===artStyle))artStyle="plain";
const STYLE_IDX=()=>(STYLES.find(x=>x[0]===artStyle)||STYLES[0])[2];
const HOME={name:"川崎市麻生区",lat:35.6037,lon:139.5079};

/* ---------- 記録 ---------- */
const KEY="kokoro-grow-v1";
let st=load(KEY,null);if(!st||!Array.isArray(st.records))st={values:[],records:[]};
if(!Array.isArray(st.cracks))st.cracks=[];if(!st.ev)st.ev={kumori:null,lastEnd:0,marks:0};if(!st.wxlog)st.wxlog={};if(st.trial===undefined)st.trial=null;if(!st.flowers)st.flowers=0;if(!st.rainbow)st.rainbow="";
const persist=()=>save(KEY,st);
const points=()=>st.records.length;
const stageIdx=()=>{let i=0;STAGES.forEach((s,k)=>{if(points()>=s[0])i=k});return i};
function careCounts(){const c={};CARE.forEach(x=>c[x[0]]=0);st.records.forEach(r=>{if(c[r.care]!=null)c[r.care]++});return c}
function formOf(){const n=points();if(n<5)return null;const c=careCounts();const top=CARE.map(x=>[x[0],c[x[0]]]).sort((a,b)=>b[1]-a[1]);
  if(top[0][1]/n<.35)return{key:"rainbow",name:"虹のボール"};return{key:top[0][0],name:CARE_MAP[top[0][0]][4]}}
function valueCounts(){const c={};st.values.forEach(v=>c[v]=0);st.records.forEach(r=>(r.values||[]).forEach(v=>{if(c[v]!=null)c[v]++}));return c}
function strengthCuts(){const out=[];st.records.forEach(r=>(r.strengths||[]).forEach(s=>out.push(s)));return out}
const rainDays=()=>st.records.filter(r=>r.tough).length;
const TODAY=dkey(new Date());
const dayOff=(k,n)=>{const p=k.split("-");const d=new Date(+p[0],p[1]-1,+p[2]+n);return dkey(d)};
const hashStr=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return((h>>>0)%10000)/10000};
// A 金継ぎ：しんどい出来事 → ひび。お世話で金の線がのびる
const SIZE=[["小さめ",2],["ふつう",3],["大きい",4]];
const openCrack=()=>st.cracks.find(c=>c.prog<c.need);
const mended=()=>st.cracks.filter(c=>c.prog>=c.need).length;
// B 心のくもり：ときどき起きる。小さな課題で晴れる。1週間で自然に晴れる
function evalKumori(){const ev=st.ev,k=ev.kumori;
  if(k){if(TODAY>dayOff(k.start,6)){ev.kumori=null;ev.lastEnd=Date.now();persist()}return}
  if(points()<3||ev.skip===TODAY)return;
  if(Date.now()-ev.lastEnd<4*864e5)return;
  if(hashStr("kumori"+TODAY)<.3){const care=CARE[Math.floor(hashStr("care"+TODAY)*5)][0];ev.kumori={start:TODAY,until:dayOff(TODAY,2),care};persist()}}
// C 天気の試練：つらい天気が3日つづくと「長雨」など。記録をつづけて抜けると、虹と花
function logWeather(){const w=wxNow();if(!w.known)return;st.wxlog[TODAY]={kind:w.kind,tough:isTough(w)};
  const keys=Object.keys(st.wxlog).sort();if(keys.length>40)keys.slice(0,keys.length-40).forEach(k=>delete st.wxlog[k]);
  const t3=[0,-1,-2].every(n=>{const x=st.wxlog[dayOff(TODAY,n)];return x&&x.tough});
  let msg="";
  if(!st.trial&&t3){const kinds=[0,-1,-2].map(n=>st.wxlog[dayOff(TODAY,n)].kind);const name=kinds.includes("snow")?"雪ごもり":kinds.some(k=>k==="rain"||k==="storm")?"長雨":"きびしい天気";st.trial={start:dayOff(TODAY,-2),name,records:0}}
  else if(st.trial&&(!st.wxlog[TODAY].tough||TODAY>dayOff(st.trial.start,10))){if(st.trial.records>0){st.flowers+=5;st.rainbow=TODAY;msg="「"+st.trial.name+"」を乗りこえました。虹が出て、花が咲きました。"}st.trial=null}
  persist();return msg}
const trialOn=()=>!!st.trial;
const kumoriOn=()=>!!st.ev.kumori;

/* ---------- 天気・季節・月 ---------- */
const SEKKI=[[1,6,"小寒"],[1,20,"大寒"],[2,4,"立春"],[2,19,"雨水"],[3,5,"啓蟄"],[3,20,"春分"],[4,4,"清明"],[4,20,"穀雨"],[5,5,"立夏"],[5,21,"小満"],[6,5,"芒種"],[6,21,"夏至"],[7,7,"小暑"],[7,23,"大暑"],[8,7,"立秋"],[8,23,"処暑"],[9,7,"白露"],[9,23,"秋分"],[10,8,"寒露"],[10,23,"霜降"],[11,7,"立冬"],[11,22,"小雪"],[12,7,"大雪"],[12,21,"冬至"]];
function sekki(d){let cur=SEKKI[SEKKI.length-1][2];for(const s of SEKKI){if(d.getMonth()+1>s[0]||(d.getMonth()+1===s[0]&&d.getDate()>=s[1]))cur=s[2]}return cur}
function moonAge(d){const ref=Date.UTC(2000,0,6,18,14);return(((d.getTime()-ref)/864e5)%29.530588+29.530588)%29.530588}
function moonName(a){return a<1.5?"新月":a<5.5?"三日月":a<9?"上弦の月":a<13.5?"十三夜":a<16?"満月":a<20?"十六夜を過ぎた月":a<24?"下弦の月":a<28?"有明の月":"新月"}
const WX={clear:"晴れ",cloudy:"くもり",fog:"霧",rain:"雨",snow:"雪",storm:"雷雨"};
function wxFromCode(c){if(c===0||c===1)return"clear";if(c===2||c===3)return"cloudy";if(c===45||c===48)return"fog";if((c>=51&&c<=67)||(c>=80&&c<=82))return"rain";if((c>=71&&c<=77)||c===85||c===86)return"snow";if(c>=95)return"storm";return"cloudy"}
let weather=load("kokoro-grow-wx",null);
const wxFresh=()=>weather&&weather.src==="live"&&Date.now()-weather.at<30*60e3;
async function fetchWeather(){
  if(wxFresh())return;
  try{const u="https://api.open-meteo.com/v1/forecast?latitude="+HOME.lat+"&longitude="+HOME.lon+"&current=temperature_2m,weather_code,wind_speed_10m,is_day&wind_speed_unit=ms&timezone=Asia%2FTokyo";
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(u,{signal:ctl.signal});if(!r.ok)throw 0;const j=await r.json();const c=j.current;
    weather={src:"live",at:Date.now(),kind:wxFromCode(c.weather_code),temp:Math.round(c.temperature_2m),wind:c.wind_speed_10m,day:c.is_day===1};save("kokoro-grow-wx",weather)}
  catch(_){if(!weather||weather.src==="live"&&Date.now()-weather.at>6*3600e3)weather={src:"none",at:Date.now(),kind:null}}
  const m=logWeather();if(m)toast=m;renderWx();if(current==="grow")renderGrow();
}
function wxNow(){const h=new Date().getHours();const day=weather&&weather.src==="live"?weather.day:(h>=6&&h<17);
  return{kind:weather&&weather.kind||"clear",temp:weather&&weather.temp,wind:weather&&weather.wind||0,day,dusk:h>=16&&h<18||h>=5&&h<7,known:!!(weather&&weather.kind)}}
function isTough(w){return["rain","snow","storm","fog"].includes(w.kind)||(w.temp!=null&&(w.temp<=5||w.temp>=33))||w.wind>=9}
function renderWx(){const w=wxNow(),d=new Date();
  const t=w.known?(WX[w.kind]+(w.temp!=null?" "+w.temp+"℃":"")):"天気：未取得";
  $("#wx").innerHTML="<b>"+esc(t)+"</b><br>"+(weather&&weather.src==="live"?esc(HOME.name)+"<br>":"")+esc(sekki(d)+"・"+moonName(moonAge(d)));
  $("#wbot").textContent=w.known&&isTough(w)?(w.kind==="rain"||w.kind==="storm"?"雨の":w.kind==="snow"?"雪の":w.kind==="fog"?"霧の":w.temp<=5?"寒い":w.temp>=33?"暑い":"風が強い")+"日も、灯りは消えない。":""}

/* ---------- 世界の描画（空・地面） ---------- */
const sky=$("#sky"),fx=$("#fx"),gl=$("#gl"),sctx=sky.getContext("2d"),fctx=fx.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){const r=gl.getBoundingClientRect();W=r.width;H=r.height;DPR=renderer?1:Math.min(2,devicePixelRatio||1);

// ひびと金継ぎ：球の表面を歩くようにひびを描き、直った分だけ金色にする
function crackPath(seed){let r=seed;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
  const pts=[];let p=new T3.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize();let tg=new T3.Vector3().crossVectors(p,new T3.Vector3(0,1,0.1)).normalize();
  for(let i=0;i<16;i++){pts.push(p.clone().multiplyScalar(1.012));const a=(rnd()-.5)*1.1;tg.applyAxisAngle(p,a);p=p.clone().addScaledVector(tg,.075).normalize();tg.sub(p.clone().multiplyScalar(tg.dot(p))).normalize()}
  return pts}
function buildCracks(){
  if(!glOK)return;while(crackGroup.children.length){const c=crackGroup.children.pop();c.geometry.dispose()}
  const dark=new T3.MeshBasicMaterial({color:0x1d1a22}),gold=new T3.MeshPhysicalMaterial({color:0xd8a93c,metalness:1,roughness:.25,emissive:0x6b4a10,emissiveIntensity:.6});
  st.cracks.forEach((c,ci)=>{const pts=crackPath(c.seed);const br=crackPath(c.seed*7+3).slice(0,8).map(v=>v);const off=pts[7].clone().sub(br[0]);br.forEach(v=>v.add(off).normalize().multiplyScalar(1.012));
    const frac=clamp(c.prog/c.need,0,1),w=.04+.01*c.size;
    [[pts,0],[br,.5]].forEach(([P,start])=>{const curve=new T3.CatmullRomCurve3(P);crackGroup.add(new T3.Mesh(new T3.TubeGeometry(curve,40,w,5,false),dark));
      const f=clamp((frac-start)/(1-start*.5),0,1);if(f>0){const n=Math.max(2,Math.round(P.length*f));const sub=new T3.CatmullRomCurve3(P.slice(0,n));crackGroup.add(new T3.Mesh(new T3.TubeGeometry(sub,40,w*1.25,5,false),gold))}})})}

const parts=[],drops=[];
function burst(x,y,n){if(reduce)return;for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*40,y:y+(Math.random()-.5)*30,vx:(Math.random()-.5)*30,vy:-20-Math.random()*40,life:1,hue:40+Math.random()*30})}

let tPrev=performance.now(),t=0;

  const w=wxNow(),tough=w.known&&isTough(w);
  drawSky(t,w);
  // 雨・雪
  fctx.clearRect(0,0,W,H);
  if(!reduce&&(w.kind==="rain"||w.kind==="storm"||w.kind==="snow")){
    const want=w.kind==="snow"?70:120;while(drops.length<want)drops.push({x:Math.random()*W,y:Math.random()*H,v:w.kind==="snow"?20+Math.random()*25:380+Math.random()*200});
    fctx.strokeStyle=w.day?"rgba(230,238,245,.55)":"rgba(170,185,205,.45)";fctx.fillStyle="rgba(255,255,255,.85)";fctx.lineWidth=2;fctx.lineCap="round";
    const sl=(w.wind||2)*6;
    for(const d of drops){d.y+=d.v*dt;d.x+=(w.kind==="snow"?Math.sin(t+d.v)*10:sl)*dt;if(d.y>H){d.y=-10;d.x=Math.random()*W}if(d.x>W)d.x-=W;
      if(w.kind==="snow"){fctx.beginPath();fctx.arc(d.x,d.y,1.6,0,Math.PI*2);fctx.fill()}else{fctx.beginPath();fctx.moveTo(d.x,d.y);fctx.lineTo(d.x-sl*.04,d.y-12);fctx.stroke()}}
  }else drops.length=0;
  if(w.kind==="fog"){fctx.fillStyle="rgba(235,238,240,.25)";fctx.fillRect(0,0,W,H)}
  // 3D
  const si=stageIdx(),target=[.28,.5,.78,.92,1.02][si];bodyScale=clamp(bodyScale+(target-bodyScale)*Math.min(1,dt*2),.1,1.2);
  if(glOK){

    body.position.set(0,.2+lift,0);
    const sc=bodyScale*(1+.06*pulse*Math.sin(t*20));pulse=Math.max(0,pulse-dt*1.5);body.scale.setScalar(sc);
    if(performance.now()-lastTouch>2500){Q.premultiply(new T3.Quaternion().setFromAxisAngle(new T3.Vector3(0,1,0),dt*(reduce?.05:.18)))}
    Q.premultiply(new T3.Quaternion().setFromAxisAngle(Wv.clone().normalize(),Wv.length()*dt));Wv.multiplyScalar(Math.exp(-dt*2));
    body.quaternion.copy(Q);

    const halo=body.userData.halo;halo.position.copy(body.position);halo.scale.setScalar(sc*(si===0?7:3.4));halo.material.opacity=glowA;

    corona.position.copy(body.position);corona.material.opacity=si>=4?(.55+.1*Math.sin(t*1.5))*bright:0;corona.scale.setScalar(sc*5.5);

    const ku=kumoriOn();bodyMat.color.setScalar(ku?.45:openCrack()?.85:1);haze.position.copy(body.position).add(new T3.Vector3(0,0,1.2));haze.scale.setScalar(sc*4.6);haze.material.opacity=ku?.85+.08*Math.sin(t*.7):0;

  if(tough){const cx=W/2,cy=H*.42,R=Math.min(W,H)*.2*bodyScale/0.8;fctx.save();fctx.strokeStyle="rgba(255,236,190,.35)";fctx.lineWidth=2;fctx.beginPath();fctx.arc(cx,cy,Math.max(1,R*1.25),Math.PI*1.15,Math.PI*1.85);fctx.stroke();fctx.restore()}

    const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.7,g=fctx.createRadialGradient(x,y,0,x,y,R*.75);g.addColorStop(0,"rgba(118,122,132,.62)");g.addColorStop(1,"rgba(118,122,132,0)");fctx.fillStyle=g;fctx.fillRect(x-R,y-R,R*2,R*2)}}

    fctx.fillStyle="hsla("+p.hue+",90%,75%,"+p.life+")";fctx.beginPath();fctx.arc(p.x,p.y,Math.max(.5,1.5+2.5*p.life),0,Math.PI*2);fctx.fill()}

  let h='<div class="section"><h2>大切にしたい価値</h2><p class="small muted">「どう生きたいか」の方向です。3〜5つ選ぶと、それぞれがボールのまわりを回る月になります。目標とちがって、達成して終わりではなく、ずっと向かっていくものです。</p>'+
    '<div class="chips">'+all.map(x=>'<button class="chip" data-pick="'+esc(x)+'" aria-pressed="'+valDraft.includes(x)+'">'+esc(x)+'</button>').join("")+'</div>'+
    '<div class="btnrow"><input type="text" id="valAdd" placeholder="ほかの価値を書く" maxlength="12" style="flex:1;min-width:0" value="'+esc(valAdd)+'"><button class="ghost" id="valAddBtn">追加</button></div>'+
    '<div class="btnrow"><button class="primary" id="valSave" '+(valDraft.length>=1&&valDraft.length<=5?"":"disabled")+'>この価値にする（'+valDraft.length+'/5）</button></div><div class="toast" id="valToast"></div>'+
    '<p class="note">価値を外すと、その月は見えなくなります（記録は残ります）。</p></div>';
  h+='<div class="section"><h2>画風</h2><p class="small muted">世界の描き方を選べます。動きが重いと感じたら「そのまま」にしてください。</p><div class="chips">'+STYLES.map(x=>'<button class="chip" data-style="'+x[0]+'" aria-pressed="'+(artStyle===x[0])+'">'+x[1]+'</button>').join("")+'</div></div>';
  h+='<div class="section"><h2>天気について</h2><p class="small">'+esc(HOME.name)+'の、いまの天気を使います。取得できないときは「育てる」で天気を選べます。季節（二十四節気）と月の満ち欠けは、端末の中で計算しています。</p><p class="note">天気の情報：Open-Meteo（open-meteo.com）</p></div>';
  h+='<div class="section"><h2>このアプリについて</h2><p class="note">こころ育ては、自分の心のためにした小さな行動を、育つボールとして見えるようにするアプリです。お世話しない日があっても、ボールが弱ったり、育ちが減ったりすることはありません。</p></div>';
  v.innerHTML=h}
function show(n){current=n;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===n));["grow","log","set"].forEach(k=>$("#v-"+k).hidden=k!==n);
  if(n==="grow")renderGrow();if(n==="log")renderLog();if(n==="set"){valDraft=null;renderSet()}}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)});

$("#v-grow").addEventListener("input",e=>{if(e.target.id==="g-text"){draft.text=e.target.value;$("#g-save").disabled=!(draft.care&&draft.text.trim())}
  if(e.target.id==="h-text"){hard.text=e.target.value;$("#h-save").disabled=!hard.text.trim()}});
$("#v-grow").addEventListener("toggle",e=>{if(e.target.id==="hardBox")hardOpen=e.target.open},true);
$("#v-grow").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.goto){show(b.dataset.goto);return}
  if(b.dataset.wx){weather={src:"manual",at:Date.now(),kind:b.dataset.wx,temp:null,wind:0,day:null};save("kokoro-grow-wx",weather);const m=logWeather();if(m)toast=m;renderWx();renderGrow();return}
  if(b.id==="kuSkip"){st.ev.kumori=null;st.ev.lastEnd=Date.now();st.ev.skip=TODAY;persist();toast="くもりを終わらせました。今日はゆっくりしてください。";renderGrow();return}
  if(b.dataset.size){hard.size=+b.dataset.size;renderGrow();return}
  if(b.id==="h-save"){const sz=hard.size;st.cracks.push({id:uid(),date:TODAY,at:Date.now(),text:hard.text.trim(),size:sz,need:SIZE[sz-1][1],prog:0,seed:Math.floor(Math.random()*2e9)+1});persist();
    hard={text:"",size:2};hardOpen=false;buildCracks();toast="ボールにひびが入りました。お世話を重ねると、金色の線でつながっていきます。";pulse=1;renderGrow();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});return}
  if(b.dataset.care){draft.care=draft.care===b.dataset.care?"":b.dataset.care;toast="";renderGrow();return}
  const tog=(arr,x)=>{const i=arr.indexOf(x);if(i>=0)arr.splice(i,1);else arr.push(x)};
  if(b.dataset.val){tog(draft.values,b.dataset.val);renderGrow();return}
  if(b.dataset.str){tog(draft.strengths,b.dataset.str);renderGrow();return}
  if(b.id==="g-save"){const w=wxNow();const before=stageIdx(),beforeForm=(formOf()||{}).name;
    st.records.push({id:uid(),date:dkey(new Date()),at:Date.now(),text:draft.text.trim(),care:draft.care,values:draft.values.slice(),strengths:draft.strengths.slice(),wx:w.known?w.kind:null,tough:!!(w.known&&isTough(w))});
    const extra=[];const oc=openCrack();if(oc){oc.prog=Math.min(oc.need,oc.prog+(draft.care==="rest"||draft.care==="connect"?2:1));if(oc.prog>=oc.need)extra.push("金継ぎができあがりました。")}
    const ku=st.ev.kumori;if(ku&&ku.care===draft.care&&TODAY<=ku.until){st.ev.kumori=null;st.ev.lastEnd=Date.now();st.ev.marks++;extra.push("くもりが晴れて、「晴れのしるし」が残りました。")}
    if(st.trial)st.trial.records++;
    persist();const after=stageIdx(),f=formOf();
    toast=(after>before?"「"+STAGES[after][1]+"」に育ちました！":(f&&f.name!==beforeForm?"姿が「"+f.name+"」になりました。":"記録しました。ボールが少し育ちました。"))+extra.join("");buildCracks();
    draft={text:"",care:"",values:[],strengths:[]};buildBody();renderHead();renderGrow();flying={t:0};window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});return}
});
$("#v-log").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.del){delAsk=b.dataset.del;renderLog();return}
  if(b.dataset.delno){delAsk=null;renderLog();return}
  if(b.dataset.crok){st.cracks=st.cracks.filter(c=>c.id!==b.dataset.crok);delAsk=null;persist();buildCracks();renderLog();return}
  if(b.dataset.delok){st.records=st.records.filter(r=>r.id!==b.dataset.delok);delAsk=null;persist();buildBody();renderHead();renderLog();return}
  if(b.id==="exp"){const s=JSON.stringify(st),ta=$("#bk");ta.hidden=false;ta.value=s;$("#imp").hidden=true;try{await navigator.clipboard.writeText(s);$("#bkToast").textContent="コピーしました。メモアプリなどに貼って保管してください。"}catch(_){ta.select();$("#bkToast").textContent="下の文字を全選択してコピーしてください。"}return}
  if(b.id==="impOpen"){const ta=$("#bk");ta.hidden=false;ta.value="";ta.placeholder="控えの文字をここに貼り付け";$("#imp").hidden=false;return}
  if(b.id==="imp"){try{const d=JSON.parse($("#bk").value);if(!d||!Array.isArray(d.records))throw 0;const ids=new Set(st.records.map(r=>r.id));let n=0;d.records.forEach(r=>{if(r&&r.id&&!ids.has(r.id)){st.records.push(r);n++}});
    st.records.sort((a,b)=>(a.at||0)-(b.at||0));if(!st.values.length&&Array.isArray(d.values))st.values=d.values.slice(0,5);persist();buildBody();renderHead();renderLog();$("#bkToast").textContent=n+"件を戻しました。"}catch(_){$("#bkToast").textContent="読み込めませんでした。"}return}
});
$("#v-set").addEventListener("input",e=>{if(e.target.id==="valAdd")valAdd=e.target.value});
$("#v-set").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.pick){const x=b.dataset.pick,i=valDraft.indexOf(x);if(i>=0)valDraft.splice(i,1);else if(valDraft.length<5)valDraft.push(x);renderSet();return}
  if(b.id==="valAddBtn"){const x=valAdd.trim();if(x&&!valDraft.includes(x)&&valDraft.length<5)valDraft.push(x);valAdd="";renderSet();return}
  if(b.dataset.style){artStyle=b.dataset.style;save("kokoro-grow-style",artStyle);if(postMat)postMat.uniforms.style.value=STYLE_IDX();renderSet();return}
  if(b.id==="valSave"){st.values=valDraft.slice();persist();buildMoons();renderSet();$("#valToast").textContent="月を入れかえました。";return}
});

evalKumori();{const m=logWeather();if(m)toast=m}
buildBody();buildCracks();renderHead();renderWx();renderGrow();requestAnimationFrame(frame);
fetchWeather();setInterval(fetchWeather,30*60e3);if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
</body>
</html>
