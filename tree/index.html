<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: the tree's small world on top (sky, the tree, a cut of soil with roots), what you did today below, the tree's ledger in tabs. Sister to こころのたま. */
:root{
  --bg:#EDEEEB; --surface:#F7F7F5; --ink:#23262A; --muted:#6C7076; --line:#D3D5D1;
  --accent:#4B4358; --accent-ink:#F7F7F5; --soft:#E4E2E8; --good:#5B7360; --warn:#8A5858;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --r:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131315; --surface:#1B1B1E; --ink:#E7E5E9; --muted:#9A979F; --line:#2E2D32;
  --accent:#BDB0CC; --accent-ink:#17161A; --soft:#26232B; --good:#9DB7A2; --warn:#D49C9C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131315; --surface:#1B1B1E; --ink:#E7E5E9; --muted:#9A979F; --line:#2E2D32;

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.8;letter-spacing:.02em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:500;font-size:1.45rem;margin:0;letter-spacing:.18em}
h2{font-family:var(--f-display);font-weight:500;font-size:1.02rem;letter-spacing:.16em;margin:0}
p{margin:0}
.date{color:var(--muted);font-size:.78rem;letter-spacing:.14em;font-variant-numeric:tabular-nums}

button:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

.wtop.night{color:#f2f0ea;text-shadow:0 1px 5px rgba(0,0,0,.5)}

.wtop span{font-size:.72rem;letter-spacing:.08em}
.wtop .r{text-align:right}

.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:.95rem;letter-spacing:.14em;padding:10px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.grid5 button b{font-family:var(--f-display);font-weight:500;font-size:.9rem}
.grid5 button span{font-size:.6rem;color:var(--muted);line-height:1.3;text-align:center}

.primary:disabled,.ghost:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.84rem;padding:8px 14px;border-radius:var(--r);cursor:pointer}
.link{border:0;background:transparent;color:var(--accent);font:inherit;font-size:.84rem;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{font-size:.84rem;color:var(--good);min-height:1.3em}
.banner{border-left:2px solid var(--accent);background:var(--soft);padding:10px 14px;font-size:.86rem}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.part{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.part b{font-family:var(--f-display);font-weight:500;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.part span{font-size:.74rem;color:var(--muted);line-height:1.5}
.part em{font-style:normal;font-family:var(--f-display);font-size:.9rem}

.rec .t{overflow-wrap:anywhere}.rec .t small{display:block;color:var(--muted);font-size:.74rem}
details.box summary{cursor:pointer;list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary h2::after{content:"　＋";color:var(--muted);font-family:var(--f-body)}
details.box[open] summary h2::after{content:"　－"}
#rings{display:block;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mood b{font-size:1.05rem}
.chip.bad[aria-pressed="true"]{background:#5a5f6e;border-color:#5a5f6e;color:#f4f4f2}
.chip.good[aria-pressed="true"]{background:#b07a3a;border-color:#b07a3a;color:#fffaf0}
@media (max-width:420px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<div class="app">

  </section>

    <button role="tab" data-v="grow" aria-selected="true">育てる</button>

  <section class="view" id="v-set" hidden></section>
</div>

<script>
(function(){
"use strict";

const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

{const d=new Date();$("today").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日（"+wd[d.getDay()]+"）"}

function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}

/* ---------- 決まりごと ---------- */
const CARE=[["rest","休む","眠る・休息","根"],["move","動く","散歩・運動","幹"],["connect","つながる","話す・会う","葉"],["challenge","挑戦する","初めて・苦手","花"],["tidy","ととのえる","片づけ・振り返り","根"]];
const CARE_MAP=Object.fromEntries(CARE.map(c=>[c[0],c]));
const STRENGTHS=[["好奇心",48],["向学心",34],["創造性",292],["勇気",8],["粘り強さ",22],["誠実さ",200],["思いやり",340],["感謝",58],["ユーモア",80],["チームワーク",160],["公平さ",232],["自分をととのえる力",272]];
const SH=Object.fromEntries(STRENGTHS);
const VALUE_IDEAS=["家族","パートナー","友人","仕事","学び・成長","健康","誠実さ","やさしさ","挑戦","遊び・楽しさ","人の役に立つ","自然","創ること","落ち着き","自立","感謝"];
const STAGES=[[0,"芽生え"],[5,"若木"],[20,"育つ木"],[50,"大きな木"],[120,"人生の大樹"]];
const SIZES=[["小",2],["中",3],["大",4]];
// 心の空模様（1日1回）と、こころに起きたこと
const MOODS=[[5,"晴れ","とても良い"],[4,"うす晴れ","まあまあ"],[3,"くもり","ふつう"],[2,"雨","しんどい"],[1,"嵐","とてもしんどい"]];
const WNAME=["","嵐","雨","くもり","うす晴れ","晴れ"];
const EVS=[["tension","緊張した","強い風が吹く","「動く」でおさまる",["move"],"風がおさまりました"],
  ["fog","もやもやした","霧が立ちこめる","空をタップするか、つながる・ととのえる で晴れる",["connect","tidy"],"霧が晴れました"],

  ["irritated","イライラした","日照りで土が乾く","ととのえる・休む で潤う",["tidy","rest"],"土が潤いました"],
  ["hurt","傷ついた","雷が鳴る","休む・つながる でしずまる",["rest","connect"],"雷がしずまりました"]];
const EVM=Object.fromEntries(EVS.map(e=>[e[0],e]));
const GOOD=[["joy","うれしかった","ちょうちょが来る"],["relief","ほっとした","やわらかな光がさす"],["thanks","ありがたかった","小鳥が来る"]];
const GOODM=Object.fromEntries(GOOD.map(e=>[e[0],e]));
const LIFE_KINDS=[["joy","うれしかった",42],["effort","がんばった",130],["hard","つらかった",25],["turn","転機",270]];
const LKM=Object.fromEntries(LIFE_KINDS.map(e=>[e[0],e]));
const SEASONS={spring:"春",summer:"夏",autumn:"秋",winter:"冬"};
const SEKKI=[[1,6,"小寒"],[1,20,"大寒"],[2,4,"立春"],[2,19,"雨水"],[3,5,"啓蟄"],[3,20,"春分"],[4,4,"清明"],[4,20,"穀雨"],[5,5,"立夏"],[5,21,"小満"],[6,5,"芒種"],[6,21,"夏至"],[7,7,"小暑"],[7,23,"大暑"],[8,7,"立秋"],[8,23,"処暑"],[9,7,"白露"],[9,23,"秋分"],[10,8,"寒露"],[10,23,"霜降"],[11,7,"立冬"],[11,22,"小雪"],[12,7,"大雪"],[12,21,"冬至"]];
function sekki(d){let cur=SEKKI[SEKKI.length-1][2];for(const s of SEKKI){if(d.getMonth()+1>s[0]||(d.getMonth()+1===s[0]&&d.getDate()>=s[1]))cur=s[2]}return cur}
// 季節は暦の上の区切り（立春・立夏・立秋・立冬）で決める
function realSeason(d){const m=d.getMonth()+1,day=d.getDate(),md=m*100+day;if(md>=204&&md<505)return"spring";if(md>=505&&md<807)return"summer";if(md>=807&&md<1107)return"autumn";return"winter"}

/* ---------- 記録 ---------- */
const KEY="life-tree-v1";
let st=load(KEY,null);if(!st||typeof st!=="object")st={};
st.values=st.values||[];st.shape=["cedar","round","umbrella"].includes(st.shape)?st.shape:"umbrella";st.records=st.records||[];st.storms=st.storms||[];st.retired=st.retired||[];st.days=st.days||{};st.active=st.active||[];st.pruned=st.pruned||[];st.life=st.life||[];
const persist=()=>save(KEY,st);
const days=()=>new Set(st.records.map(r=>r.date)).size;
const stageIdx=()=>{let i=0;STAGES.forEach((s,k)=>{if(st.records.length>=s[0])i=k});return i};
const cnt=f=>st.records.filter(f).length;
const openStorm=()=>st.storms.find(s=>s.prog<s.need);
const dayAgo=k=>{const d=new Date();d.setDate(d.getDate()-k);return dkey(d)};
const daysSince=ds=>Math.round((Date.parse(TODAY)-Date.parse(ds))/864e5);
const activeEv=()=>st.active.filter(a=>!a.healed&&daysSince(a.date)<=2);
const lifeSorted=()=>st.life.slice().sort((a,b)=>((a.age==null||a.age==="")?999:+a.age)-((b.age==null||b.age==="")?999:+b.age)||a.at-b.at);
const moodWord=m=>m==null?"記録なし":m>=4.3?"晴れ":m>=3.5?"うす晴れ":m>=2.7?"くもり":m>=1.8?"雨":"嵐";
// 木のまわりの天気：最近の心の空模様（新しい日ほど重く）と、まだ手当てしていない出来事で決まる
function weather(){let sum=0,ws=0;const W5=[1,.7,.5,.35,.25];for(let k=0;k<5;k++){const d=st.days[dayAgo(k)];if(d&&d.mood){sum+=d.mood*W5[k];ws+=W5[k]}}
  let sc=ws?sum/ws:4.6;sc+=Math.min(.75,.25*cnt(r=>r.date===TODAY));
  let lv=sc>=4.3?5:sc>=3.5?4:sc>=2.7?3:sc>=1.8?2:1;
  let run=0;for(let k=0;k<30;k++){const d=st.days[dayAgo(k)];if(k===0&&!(d&&d.mood))continue;if(d&&d.mood&&d.mood<=2)run++;else break}
  const act={};activeEv().forEach(a=>{act[a.type]=Math.max(act[a.type]||0,a.type==="fog"?(a.fog==null?1:a.fog):1)});

  const good={};((st.days[TODAY]||{}).good||[]).forEach(g=>good[g]=1);
  let wasRain=false;for(let k=1;k<=3;k++){const d=st.days[dayAgo(k)];if(d&&d.mood&&d.mood<=2)wasRain=true}

// 落ち葉：前の季節までに出た葉は、冬を越すたびに土に還る
function fallenLeaves(){const s=realSeason(new Date());const y=new Date().getFullYear();
  const cutoff=s==="winter"||s==="spring"?null:null;let n=0;st.records.forEach(r=>{const d=new Date(r.at||Date.parse(r.date));if(Date.now()-d.getTime()>200*864e5)n++});return n}

/* ---------- 描画 ---------- */
const cv=$("tree");let ctx=cv.getContext("2d");const mainCtx=ctx;const layer=document.createElement("canvas");let layerKey="";let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);built=null}
addEventListener("resize",resize);
let preview=null;const season=()=>preview||realSeason(new Date());
const SKY={spring:["#cfe3ef","#f4ecef"],summer:["#8ec5e8","#e5f2f2"],autumn:["#e8cfa8","#f3e7d6"],winter:["#c6d1db","#eef1f4"]};
const NIGHT={spring:["#1d2440","#3a3f5e"],summer:["#142038","#2c3f5a"],autumn:["#241f33","#4a3a44"],winter:["#151b2b","#333c50"]};
const LEAF={spring:[[96,55,62],[84,50,58],[120,40,66]],summer:[[110,45,36],[125,40,30],[100,42,42]],autumn:[[18,75,52],[32,82,55],[45,80,55],[8,62,45]],winter:[[30,25,48]]};
let built=null,gust=0,wind=0,wiltNow=false,nextBolt=3,bolt=null,lifeSeeds=[];const fallers=[],rains=[];

// 木の形をつくる（記録が変わったときだけ）
function build(){if(st.shape==="cedar")return buildCedar();
  const gy=H*.72,cxT=W/2,R=st.records,n=R.length,D=days(),si=stageIdx();
  const um=st.shape==="umbrella";
  const trunkH=(40+H*.34*(1-Math.exp(-(n+2)/40))+Math.min(30,D*.6))*(um?[.5,.5,.52,.55,.58][si]:1);

  const segs=[],tips={},knots=[];
  const storms=st.storms;
  // 枝を描く（再帰）
  function branch(id,x,y,ang,len,w,depth,maxD,seed,path){
    const rnd=rng(seed);const bend=(rnd()-.5)*.35;
